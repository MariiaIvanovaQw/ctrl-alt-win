# Локальный запуск в контейнерах.
#
#   docker compose up --build                     # веб + API + PostgreSQL + Mailpit
#   docker compose --profile keycloak up --build  # плюс Keycloak (realm platform)
#
# При первом запуске API сам заполняет пустую базу демо-данными (около
# минуты): 240 кандидатов, 3 компании, вакансии, участники ФСП. Учётные
# записи — в файле /data/demo_accounts.json внутри контейнера api:
#   docker compose exec api cat /data/demo_accounts.json
#
# Веб:      http://localhost:5173 (кабинеты кандидата и работодателя)
# API:      http://localhost:8000/docs
# Почта:    http://localhost:8025 (Mailpit, только с этой машины)
# Keycloak: http://localhost:8080 (администратор задаётся KC_ADMIN_PASSWORD)
#
# Пароли и адреса можно переопределить в файле .env рядом с этим файлом
# (POSTGRES_PASSWORD, KC_ADMIN_PASSWORD, APP_PUBLIC_BASE_URL, …).
# Стенд для жюри запускается в демо-режиме (APP_DEMO_MODE=true): открыт
# экспресс-режим теста и сброс попыток. Для данных реальных людей —
# APP_DEMO_MODE=false.
#
# Чтобы API принимал токены Keycloak, а не выпускал свои, задайте перед
# запуском APP_AUTH_MODE=keycloak (см. backend/README.md, раздел «Docker и Keycloak»).

# Имя проекта задано явно: по умолчанию Compose берёт его из имени каталога,
# а каталог с кириллицей в названии даёт пустое имя и ошибку запуска.
name: fsp-talent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talent
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      # интерфейс почты открыт только на этой машине: в письмах ссылки подтверждения и восстановления пароля
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: prod
      APP_DEMO_MODE: ${APP_DEMO_MODE:-true}
      APP_DATABASE_URL: postgresql+psycopg://talent:${POSTGRES_PASSWORD:-talent}@db:5432/talent
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_CORS_ORIGINS: '${APP_CORS_ORIGINS:-["http://localhost:5173"]}'
      APP_SMTP_HOST: mailpit
      APP_SMTP_PORT: "1025"
      APP_AUTH_MODE: ${APP_AUTH_MODE:-local}
      # издатель — адрес, который видит браузер; ключи API берёт по внутреннему адресу
      APP_KEYCLOAK_ISSUER: http://localhost:8080/realms/platform
      APP_KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/platform/protocol/openid-connect/certs
      APP_KEYCLOAK_AUDIENCE: talent-api
      APP_FSP_MODE: inprocess
      # число процессов uvicorn: Python выполняет код в одном потоке на процесс,
      # несколько процессов дают параллельную обработку (см. backend/reports/benchmark_4workers.md)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    ports:
      - "8000:8000"
    volumes:
      - apidata:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s  # первый запуск заполняет базу демо-данными

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Адрес, по которому API виден из браузера пользователя,
        # а не из контейнера: бандл собирается для браузера.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    volumes:
      - ./backend/deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:
  apidata:
