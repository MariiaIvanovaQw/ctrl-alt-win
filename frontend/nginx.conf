server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности. CSP разрешает скрипты, стили, шрифты и картинки
    # только с этого сайта и запросы к API; connect-src должен совпадать с
    # VITE_API_BASE (подставляется при сборке образа, см. Dockerfile).
    # 'unsafe-inline' для стилей нужен React: он задаёт стили атрибутом style.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Маршрутизация на стороне клиента: любой неизвестный путь отдаёт index.html,
    # иначе прямая ссылка на /candidate/invitations/... вернула бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные имена файлов — можно кэшировать надолго.
    # add_header внутри location отменяет заголовки сервера, поэтому они повторены.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
