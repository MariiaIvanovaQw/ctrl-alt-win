# Проверка Python-кода бэкенда и инструментов банка заданий: ruff check .
line-length = 120
target-version = "py310"
extend-exclude = ["**/.venv", "**/node_modules"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "DTZ", "RUF"]
ignore = [
    "E501",    # длинные строки допустимы: тексты сообщений и пояснений на русском
    "B008",    # Depends(), Query(), File() в значениях по умолчанию — идиома FastAPI
    "UP031",   # форматирование через % — принятый в проекте стиль
    "RUF001",  # кириллица и типографские символы (×, –, «») в строках
    "RUF002",
    "RUF003",
    "C408",    # dict(...) с именованными аргументами читается не хуже литерала
    "RUF005",  # list(a) + [b] вместо распаковки — допустимо
    "SIM103",  # явные if/return в правилах доступности читаются лучше однострочников
    "SIM108",
    "SIM110",
]

[lint.isort]
known-first-party = ["app", "scripts", "tests"]
